RANDOM:
  seed: 1234

DIRECTORIES:
  dataset_dir: 'flw_dataset_radarscenes'
  model_weights_dir: 'model_weights/gnn'
  weights_name: 'graph_based_detector.pt'
  finetuned_weights_name: graph_based_detector_finetuned.pt'

DATA_SELECTION_PARAM:
  reject_static_meas_by_ransac: False
  temporal_window_size: 0
  ball_query_eps_square: 25
  k_number_nearest_points: 10
  dataset_augmentation: False    # ✅ enabled for better generalization

DATASET_INFO:
  radarmeas_attributes_all:   
    [ 'point_x', 'point_y', 'point_z',
      'snr', 'range',
      'azimuth_sin', 'azimuth_cos',
      'elevation_sin', 'elevation_cos',
      'robot_prefix_num' ]
  radarmeas_attributes_selected: 
    ['point_x', 'point_y', 'point_z',
     'snr', 'range',
     'azimuth_sin', 'azimuth_cos',
     'elevation_sin', 'elevation_cos',
     'robot_prefix_num']
  include_region_confidence: True

OBJECT_CATEGORIES:
  OBJECT_CLASS: ['Other', 'Workstation', 'Robot', 'Boundary','Forklift','No Forklift']
  OBJECT_CLASS_WEIGHTS:      [0.2 , 0.25, 0.4 , 0.2, 0.5 , 0.0]   # ← Used in classification (softmax loss)
  OBJECT_CLASS_DYN: ['Other', 'Workstation', 'Robot', 'Boundary','Forklift','No Forklift']
  OBJECT_CLASS_WEIGHTS_DYN:  [0.2 , 0.25, 0.4 , 0.2, 0.5 , 0.0]   # ← Used in object classification


GRID_LIMITS: 
  max_x: 10.0
  min_x: -10.0
  max_y: 5.0
  min_y: -5.0
  min_sigma_x: -0.5
  max_sigma_x: 0.5
  min_sigma_y: -0.2
  max_sigma_y: 0.2
  dx: 0.1
  dy: 0.1

GNN_ARCHITECTURE:
  node_input_dim: 10
  input_edge_feat_dim: 5
  node_features: ['point_x', 'point_y', 'point_z', 'snr', 'range', 'azimuth_sin', 'azimuth_cos', 'elevation_sin', 'elevation_cos', 'robot_prefix_num']
  edge_features: ['dx', 'dy', 'dz', 'd_snr', 'dt']
  reg_offset: ['dx', 'dy']
  activation: 'leakyrelu'
  normalization: 'channel_normalization'
  num_groups: None
  reg_mu: [0, 0]
  reg_sigma: [4, 2]
  aggregation: 'add'
  node_feat_enc_stem_channels: [256, 128, 64]
  edge_feat_enc_stem_channels: [256, 128, 128, 64]
  graph_convolution_stem_channels: [64, 64, 64,] # 🔧 reduced from 7 to 5 blocks
  msg_mlp_hidden_dim: 128
  num_blocks_to_compute_edge: 1
  hidden_node_channels_GAT: 512
  num_heads_GAT: 8
  link_pred_stem_channels: [64, 64, 64]
  node_pred_stem_channels: [86, 64, 64]
  num_edge_classes: 2

LOSS_WEIGHTS:
  obj_loss_cls: 0  # 🔧 reduced
  node_loss_cls: 1.5
  edge_loss_cls: 2.0     # 🔧 reduced
  node_loss_reg: 0

OPTIMIZATION:
  optim: adam            # 🔧 switched to Adam
  max_training_iterations: 100000 
  learning_rate: 0.001   # 🔧 adjusted
  weight_decay: 0.00001  # 🔧 less aggressive

FINETUNING:
  optim: adam
  max_training_iterations: 10000 
  learning_rate: 0.0005
  weight_decay: 0.00001
  clustering_eps: 1.5

DATASET:
  num_training_samples: -1
  num_validation_samples: -1
  shuffle_training_samples: True
  shuffle_validation_samples: True

